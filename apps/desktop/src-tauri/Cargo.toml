[package]
name = "artemis-host"
version = "0.0.0"
description = "Artemis local host — asset catalog, workspace state, and agent launching"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "artemis_host"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# Cancelling a turn has to kill the whole process group: opencode spawns
# children, and killing only the direct child leaves them holding the stdout
# pipe open.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
