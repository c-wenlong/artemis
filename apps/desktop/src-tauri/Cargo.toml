[package]
name = "artemis-host"
version = "0.0.0"
description = "Artemis local host — asset catalog, workspace state, and agent launching"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "artemis_host"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Cancelling a turn has to kill the whole process group: opencode spawns
# children, and killing only the direct child leaves them holding the stdout
# pipe open.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
# Already in the tree via tauri; used to check the shipped icon artwork sits on
# Apple's icon grid rather than filling its canvas.
png = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
