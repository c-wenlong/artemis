<!doctype html>
<!--
  Light is the product direction, not a preference to be guessed at: pinning
  data-theme means a dark-mode OS does not silently override it. Dark tokens are
  complete and ship behind this attribute, ready for a theme toggle.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2523'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial' font-size='16' font-weight='700' fill='%23f7f0cf'%3EA%3C/text%3E%3C/svg%3E"
    />
    <title>Artemis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
